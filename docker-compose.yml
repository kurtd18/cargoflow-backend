services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cargoflow
      POSTGRES_PASSWORD: cargoflow
      POSTGRES_DB: cargoflow
    ports:
      - "5432:5432"
    volumes:
      - cargoflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://cargoflow:cargoflow@db:5432/cargoflow
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  cargoflow_pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cargoflow
          POSTGRES_PASSWORD: cargoflow
          POSTGRES_DB: cargoflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cargoflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cargoflow:cargoflow@localhost:5432/cargoflow
      JWT_SECRET: test-secret-solo-para-ci
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "*"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr las pruebas
        run: pytest tests/ -v